<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buisness name genrator</title>
</head>
<body>
    <script>
        let first , second , third;

        let rand = Math.random();
        
        // frist thing 
        if(rand<0.33){
            first = "crazy";
        }
        else if(rand>=0.33 && rand<0.66){
            first = "amazing";
        }
        else{
            first = "fire";
        }

        //second thing
        rand = Math.random();
        if(rand<0.33){
            second = "engine";
        }
        else if(rand>=0.33 && rand<0.66){
            second = "foods";
        }
        else{
            second = "garments";
        }

        // third  thing
        rand= Math.random();
        if(rand<0.33){
            third = "bros";
        }
        else if(rand>=0.33 && rand<0.66){
            third = "limited";
        }
        else{
            third = "hub";
        }

        console.log(`${first} ${second} ${third}`);

    </script>
</body>
</html>
